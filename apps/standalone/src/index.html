<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="referrer" content="no-referrer">
        <link rel="shortcut icon" href="favicon.ico">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
        <link rel="manifest" crossorigin="use-credentials" href="manifest.webmanifest">
        <title>Helium-III</title>
        <style>
            /* Startup splash. Inline so it renders before any script or stylesheet is fetched;
               apps/client/src/services/splash.ts drives the status line and removes the element
               once the application has loaded. */
            #splash {
                position: fixed;
                inset: 0;
                z-index: 10000;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #f4f3f8;
                color: #5e5a6e;
                font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
                transition: opacity 0.4s ease;
            }
            #splash.splash-hidden {
                opacity: 0;
                pointer-events: none;
            }
            #splash .splash-content {
                display: flex;
                flex-direction: column;
                align-items: center;
                /* Fades in after a delay, so a fast startup shows a blank page instead of a
                   flash of logo. */
                opacity: 0;
                animation: splash-appear 0.4s ease 0.3s forwards;
            }
            #splash .splash-logo {
                width: 96px;
                height: 96px;
            }
            #splash .splash-title {
                margin-top: 16px;
                font-size: 22px;
                font-weight: 600;
                letter-spacing: 0.02em;
                color: #3a3747;
            }
            #splash .splash-bar {
                width: 240px;
                height: 3px;
                margin-top: 24px;
                border-radius: 2px;
                overflow: hidden;
                background: rgba(128, 128, 128, 0.2);
            }
            #splash .splash-bar-fill {
                width: 40%;
                height: 100%;
                border-radius: 2px;
                background: #8f7bc4;
                animation: splash-slide 1.4s ease-in-out infinite;
            }
            /* Tracking state, installed by splash.ts once the startup phases are known. The long
               ease-out carries the fill towards the running phase's end without ever reaching it,
               so a slow step keeps moving instead of looking stalled. */
            #splash .splash-bar.is-continuous .splash-bar-fill {
                width: 0;
                animation: none;
                transition: width 12s cubic-bezier(0.16, 0.85, 0.3, 1);
            }
            #splash .splash-bar.is-continuous.is-starting .splash-bar-fill {
                transition: none;
            }
            #splash .splash-bar.is-continuous.is-finishing .splash-bar-fill {
                transition: width 0.3s ease;
            }
            #splash-status {
                min-height: 1.5em;
                margin-top: 12px;
                font-size: 13px;
                text-align: center;
            }
            #splash.splash-error .splash-bar {
                display: none;
            }
            #splash.splash-error #splash-status {
                max-width: min(480px, 85vw);
                color: #e33f3b;
            }
            @keyframes splash-appear {
                to { opacity: 1; }
            }
            @keyframes splash-slide {
                0% { transform: translateX(-110%); }
                100% { transform: translateX(260%); }
            }
            @keyframes splash-pulse {
                0%, 100% { opacity: 0.3; }
                50% { opacity: 1; }
            }
            @media (prefers-color-scheme: dark) {
                #splash { background: #1a1922; color: #9a96ad; }
                #splash .splash-title { color: #cfcbe0; }
            }
            @media (prefers-reduced-motion: reduce) {
                #splash .splash-content { opacity: 1; animation: none; }
                #splash .splash-bar-fill { width: 100%; animation: splash-pulse 1.8s ease-in-out infinite; }
                #splash .splash-bar.is-continuous .splash-bar-fill { transition: width 0.2s linear; }
            }
            @media print {
                #splash { display: none; }
            }
        </style>
    </head>

    <body id="trilium-app">
        <noscript>
            <style>
                #splash { display: none; }
            </style>
            Helium-III requires JavaScript to be enabled.
        </noscript>

        <div id="splash" role="status">
            <div class="splash-content">
                <svg class="splash-logo" viewBox="-9.589 -9.589 219.178 219.178" aria-hidden="true"><rect x="-9.589" y="-9.589" width="219.178" height="219.178" rx="49.096" fill="#1a1922"/><g transform="rotate(-40 100 100)"><path d="M156.57 120.01A60 60 0 0 1 43.43 120.01M43.43 79.99A60 60 0 0 1 156.57 79.99" fill="none" stroke="#cfcbe0" stroke-width="5" stroke-linecap="round"/></g><circle cx="145.96" cy="61.43" r="13" fill="none" stroke="#cfcbe0" stroke-width="5"/><line x1="138.81" y1="61.43" x2="153.11" y2="61.43" stroke="#cfcbe0" stroke-width="4" stroke-linecap="round"/><circle cx="54.04" cy="138.57" r="13" fill="none" stroke="#cfcbe0" stroke-width="5"/><line x1="46.89" y1="138.57" x2="61.19" y2="138.57" stroke="#cfcbe0" stroke-width="4" stroke-linecap="round"/><circle cx="100" cy="81.52" r="16" fill="none" stroke="#cfcbe0" stroke-width="5"/><line x1="91.68" y1="81.52" x2="108.32" y2="81.52" stroke="#cfcbe0" stroke-width="4" stroke-linecap="round"/><line x1="100" y1="73.2" x2="100" y2="89.84" stroke="#cfcbe0" stroke-width="4" stroke-linecap="round"/><circle cx="84" cy="109.24" r="16" fill="none" stroke="#cfcbe0" stroke-width="5"/><line x1="75.68" y1="109.24" x2="92.32" y2="109.24" stroke="#cfcbe0" stroke-width="4" stroke-linecap="round"/><line x1="84" y1="100.92" x2="84" y2="117.56" stroke="#cfcbe0" stroke-width="4" stroke-linecap="round"/><circle cx="116" cy="109.24" r="16" fill="#8f7bc4" stroke="#8f7bc4" stroke-width="5"/></svg>
                <div class="splash-title">Helium-III</div>
                <div class="splash-bar"><div class="splash-bar-fill"></div></div>
                <div id="splash-status"></div>
            </div>
        </div>

        <div id="context-menu-cover"></div>

        <!-- Required for match the PWA's top bar color with the theme -->
        <!-- This works even when the user directly changes --root-background in CSS -->
        <div id="background-color-tracker" style="position: absolute; visibility: hidden; color: var(--root-background); transition: color 1ms;"></div>

        <!-- Bootstrap (request server for required information) -->
        <script src="./main.ts" type="module"></script>

        <!-- Required for correct loading of scripts in Electron -->
        <script>
            if (typeof module === 'object') {window.module = module; module = undefined;}
        </script>
    </body>
</html>
